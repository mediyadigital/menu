let lang='EN',active='Featured',cart=[],lifted=null;
const $=id=>document.getElementById(id),all=()=>Object.values(data).flat(),find=id=>all().find(x=>x.id===id);
function renderStatic(){const c=copy[lang];$('brand').textContent=c.brand;$('brand2').textContent=c.brand2;$('tag').textContent=c.tag;$('menuTitle').innerHTML=c.title+' <span>♥️</span>';$('subTitle').textContent=c.sub;$('scroll').textContent=c.scroll;$('cartTitle').textContent=c.cart;$('whatsapp').textContent=c.send;$('lang').textContent=lang;document.body.className=lang.toLowerCase();}
function renderNav(){const c=copy[lang];const names=Object.keys(data);$('sidebar').innerHTML=names.map((name,i)=>`<button class="nav-item ${name===active?'active':''}" data-cat="${name}"><span style="font-size:20px;line-height:20px">${icons[i]}</span><span>${c.cats[i]}</span></button>`).join('')+`<div class="flower"><svg viewBox="0 0 70 110" fill="none"><path d="M35 108C35 72 28 54 35 28" stroke="#78a58a" stroke-width="2" stroke-linecap="round"/><ellipse cx="23" cy="53" rx="11" ry="6" fill="#a8ceb2" transform="rotate(-30 23 53)"/><ellipse cx="48" cy="65" rx="11" ry="6" fill="#a8ceb2" transform="rotate(30 48 65)"/><circle cx="35" cy="26" r="9" fill="#f1b9c7"/><circle cx="27" cy="20" r="6" fill="#f8dbe1"/><circle cx="43" cy="20" r="6" fill="#f8dbe1"/><circle cx="35" cy="27" r="3" fill="#d9879b"/></svg></div>`;$('sidebar').querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{active=b.dataset.cat;lifted=null;renderNav();renderCards()});}
function renderCards(){const c=copy[lang];$('content').innerHTML=data[active].map((x,i)=>`<article class="card ${x.color} ${lifted===x.id?'lifted':''}" style="z-index:${lifted===x.id?50:data[active].length-i};animation-delay:${i*.05}s" data-id="${x.id}"><div class="card-bg"></div><div class="info"><h2>${x.title[lang]} <span>♡</span></h2><p>${x.desc[lang]}</p><div class="price-row"><strong class="price">$${x.price.toFixed(2)}</strong><button class="add" data-add="${x.id}">${c.add}</button></div></div><img class="food" src="${x.image}" alt="${x.title[lang]}"></article>`).join('');$('content').querySelectorAll('.card').forEach(card=>card.onclick=e=>{if(e.target.closest('.add'))return;const id=+card.dataset.id;lifted=lifted===id?null:id;renderCards()});$('content').querySelectorAll('.add').forEach(b=>b.onclick=e=>{e.stopPropagation();add(+b.dataset.add)});}
function add(id){const x=cart.find(i=>i.id===id);if(x)x.qty++;else cart.push({id,qty:1});renderCartBadge()}
function update(id,d){const x=cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);renderCart() ;renderCartBadge()}
function renderCartBadge(){const n=cart.reduce((s,x)=>s+x.qty,0);$('badge').textContent=n;$('badge').classList.toggle('show',n>0)}
function renderCart(){const c=copy[lang];let total=0;$('cartItems').innerHTML=cart.length?cart.map(x=>{const item=find(x.id);total+=item.price*x.qty;return `<div class="cart-item"><div class="cart-item-info"><strong>${item.title[lang]}</strong><span>$${(item.price*x.qty).toFixed(2)}</span></div><div class="qty"><button data-minus="${x.id}">−</button><b>${x.qty}</b><button data-plus="${x.id}">+</button></div></div>`}).join(''):`<p class="empty">${lang==='KU'?'سەبەتەکە بەتاڵە':lang==='AR'?'السلة فارغة':'Your basket is waiting for a sweet pick.'}`;$('total').textContent=`${c.total} $${total.toFixed(2)}`;$('cartItems').querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>update(+b.dataset.minus,-1));$('cartItems').querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>update(+b.dataset.plus,1));}
$('lang').onclick=()=>{lang=lang==='EN'?'KU':lang==='KU'?'AR':'EN';renderStatic();renderNav();renderCards();renderCart()};$('cartBtn').onclick=()=>{$('cartModal').classList.add('open');renderCart()};$('closeCart').onclick=()=>$('cartModal').classList.remove('open');$('whatsapp').onclick=()=>{if(!cart.length)return;const message=cart.map((x,i)=>`${i+1}. ${x.qty}x ${find(x.id).title[lang]} - $${(find(x.id).price*x.qty).toFixed(2)}`).join('\n')+'\n\n'+copy[lang].total+' $'+cart.reduce((s,x)=>s+find(x.id).price*x.qty,0).toFixed(2);window.open('https://wa.me/9647500000000?text='+encodeURIComponent(message),'_blank')};renderStatic();renderNav();renderCards();renderCartBadge();
</script>
