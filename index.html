<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sweet Bliss — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg: #fbeef0;
    --ink: #2f4a3f;
    --ink-soft: #4f6b5d;
    --rose-deep: #c65a78;
    --gold-line: #e7b9c2;
    --shadow-soft: 0 15px 35px -10px rgba(60,40,45,0.2);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family: 'Quicksand', sans-serif;
    /* باکگراوەندێ سەرەکی */
    background: url('image/bg.jpg') center center / cover no-repeat fixed;
    background-color: #fceceb; 
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10px;
  }

  /* ===== PHONE FRAME ===== */
  .frame{
    position:relative;
    width: 430px; 
    max-width: 100%;
    height: 94vh; 
    border-radius: 40px;
    background: rgba(253, 246, 247, 0.75); 
    backdrop-filter: blur(25px); 
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: var(--shadow-soft), 0 0 0 8px rgba(255,255,255,0.4);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  @media (max-width: 480px) {
    .stage { padding: 0; }
    .frame { 
      width: 100vw; 
      height: 100vh; 
      max-height: 100vh; 
      border-radius: 0; 
      border: none; 
      box-shadow: none; 
    }
  }

  /* header */
  .header{
    position:relative;
    padding:20px 20px 15px 20px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-shrink:0;
    z-index: 9999;
  }
  
  .logo{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1;
  }
  .logo svg{ width:44px;height:44px; margin-bottom:2px; }
  .logo .word{
    font-family:'Dancing Script', cursive;
    font-size:26px;
    color:var(--rose-deep);
    font-weight:700;
    margin-top:-4px;
  }
  .logo .brand{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    font-size:12px;
    color:var(--ink);
    margin-top:2px;
  }
  .logo .tag{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    letter-spacing:1.6px;
    font-size:8px;
    color:var(--ink-soft);
    margin-top:3px;
  }

  /* سەنتەرکرنا نڤیسینا مینیو */
  .title-block{
    position: absolute;
    width: 100%;
    left: 0;
    top: 24px;
    text-align: center;
    pointer-events: none; 
  }
  .title-block h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:36px;
    color:var(--ink);
    margin:0;
    letter-spacing:1px;
  }
  .title-block h1 .heart{ color:#ff7e93; font-size:18px; vertical-align: super; }
  .title-block .sub{
    font-family:'Dancing Script', cursive;
    font-size:15px;
    color:var(--rose-deep);
    margin-top:-4px;
  }

  /* دوگمەیێن لایێ ڕاستێ */
  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 15px; 
    z-index: 10;
    margin-top: 2px;
  }

  .close-btn{
    width:36px;height:36px;
    border-radius:50%;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(242, 213, 219, 0.8);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(200,100,120,0.1);
    transition: all .2s ease;
  }
  .close-btn:hover{ transform: scale(1.05); background:#ffe5e9; }
  .close-btn svg{ width:15px;height:15px; stroke: var(--rose-deep); }

  /* دوگمەیا زمانێ یا خڕ ل بن (X) */
  .lang-btn {
    width:36px; height:36px;
    border-radius:50%;
    background: linear-gradient(135deg, rgba(210, 240, 220, 0.9), rgba(190, 225, 205, 0.9));
    border: 1px solid rgba(255, 255, 255, 0.9);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(45, 90, 68, 0.15);
    transition: all .2s ease;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #2d5a44; 
  }
  .lang-btn:hover { transform: scale(1.05); background: rgba(204, 235, 214, 0.95); }
  .lang-btn:active { transform: scale(0.95); }

  /* body layout */
  .body{
    flex: 1;
    display:flex;
    padding:4px 14px 14px 14px;
    gap:14px;
    overflow:hidden; /* ڤێرە سکرۆل نابیت */
    position:relative;
    z-index: 10;
  }

  /* ====== SIDEBAR (شاهانە و ڕێکخستی بێ سکرۆل) ====== */
  .sidebar{
    width: 72px;
    height: 100%; 
    flex-shrink:0;
    background: linear-gradient(180deg, rgba(227, 239, 232, 0.7), rgba(204, 227, 214, 0.7));
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 28px;
    /* پادینگێ سەرێ و بنێ من زۆر کێم کر دا هەمی تشت ب جیهـ ببن */
    padding: 10px 4px 10px 4px; 
    display:flex;
    flex-direction:column;
    align-items:center;
    /* ڤالاهییا ناڤبەرا ئایکۆنان من کێم کر */
    gap: 3px; 
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
    overflow: hidden; /* قەت سکرۆل نابیت! */
  }
  
  .nav-item{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 2px;
    padding: 6px 2px; /* من بچویکتر کر */
    border-radius: 18px;
    cursor:pointer;
    background:transparent;
    border:none;
    font-family:'Quicksand',sans-serif;
    color: var(--ink-soft);
    transition: all .3s ease;
  }
  .nav-item svg{ width:20px;height:20px; stroke: var(--ink); stroke-width: 1.2; transition: stroke .3s ease; }
  .nav-item span{ font-size:8.5px; font-weight:700; letter-spacing:0px; text-align: center;}
  .nav-item:hover{ background: rgba(255,255,255,0.5); }
  .nav-item.active{
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .nav-item.active svg{ stroke: #e3869b; stroke-width: 1.8; }
  .nav-item.active span{ color: #e3869b; }

  /* گولا پیڤازی (ڕێک ل بنێ داشبۆردی ب جوانی دیارە) */
  .sidebar-deco{
    margin-top: auto; /* پێدا ددەتە خوارێ */
    margin-bottom: 2px;
    width: 48px;
    height: 58px;
    opacity: 0.9;
  }

  /* content - تەنها ئەڤ بەشە سکرۆل دبیت */
  .content{
    position:relative;
    flex:1;
    height: 100%;
    overflow-y:auto;
    overflow-x:visible; 
    padding: 10px 4px 80px 4px; 
    scrollbar-width:none;
    -webkit-overflow-scrolling: touch;
  }
  .content::-webkit-scrollbar{ display:none; }

  /* ===== دیزاینا کارتان (د سەر ئێک دا وەکی وێنێ تە) ===== */
  .card{
    position:relative;
    min-height:165px;
    /* ئەڤە کارتان گەلەک دکەتە د سەر ئێک دا (Overlap) */
    margin-bottom: -45px; 
    transition: transform 0.3s ease;
    display:flex;
    align-items: center;
    animation: slideUp 0.5s ease forwards;
    opacity: 0;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:last-child{ margin-bottom: 30px; } 
  
  .card-bg {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    box-shadow: 0 -8px 20px -5px rgba(0,0,0,0.08); /* سێبەرا سەرڤە دا کارتێن د سەر ئێک دا جوان دەرکەڤن */
    z-index: 1;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.8);
  }

  /* تریکا سەرەکی بۆ ڤەنەشارتنا نڤیسینێ: 
     من نڤیسین هەمی پاڵدا بۆ سەری (padding-bottom مەزن کر) دا کارتا سەرێ ل سەر نەگریت */
  .card .info{
    position:relative;
    z-index:2;
    padding: 15px 10px 50px 16px; 
    width: 60%; 
    display:flex;
    flex-direction:column;
    justify-content: center;
    pointer-events: none; 
  }
  .card h2{
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 4px 0;
    line-height:1.1;
  }
  .card h2 .heart{ font-size:11px; vertical-align: top; opacity:0.6; }
  .card p.desc{
    font-family:'Quicksand', sans-serif;
    font-size:10px;
    line-height:1.4;
    color: var(--ink-soft);
    margin:0 0 8px 0;
    font-weight:600;
    min-height: 28px; 
  }
  
  .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between; 
    gap: 10px; 
    z-index: 5;
    position: relative;
    pointer-events: auto;
  }
  .card .price{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:16px;
  }

  .add-btn {
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #ffffff;
    border-radius: 12px;
    padding: 5px 12px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 11px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .add-btn:hover { background: #ffffff; transform: scale(1.05); }
  .add-btn:active { transform: scale(0.95); }

  /* وێنێ خوارنێ (3D Floating) */
  @keyframes floatImg {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  .card .food-img {
    position: absolute;
    right: -5px; 
    top: -25px; /* ئینا سەریتر دا دگەل قەبارێ کارتێ بگونجیت */
    width: 45%; 
    height: 115%; 
    object-fit: contain;
    z-index: 3;
    filter: drop-shadow(-5px 15px 10px rgba(0,0,0,0.25)); 
    pointer-events: none; 
    animation: floatImg 4s ease-in-out infinite; 
  }

  /* Colors Default */
  .c1 .card-bg { background: linear-gradient(135deg, rgba(251, 230, 235, 0.85), rgba(249, 206, 215, 0.85)); } 
  .c1 h2, .c1 .price, .c1 .add-btn { color: #c25972; }

  .c2 .card-bg { background: linear-gradient(135deg, rgba(227, 242, 232, 0.85), rgba(203, 230, 212, 0.85)); } 
  .c2 h2, .c2 .price, .c2 .add-btn { color: #355845; }

  .c3 .card-bg { background: linear-gradient(135deg, rgba(252, 237, 241, 0.85), rgba(250, 217, 225, 0.85)); } 
  .c3 h2, .c3 .price, .c3 .add-btn { color: #d06d84; }

  .c4 .card-bg { background: linear-gradient(135deg, rgba(252, 244, 235, 0.85), rgba(243, 222, 202, 0.85)); } 
  .c4 h2, .c4 .price, .c4 .add-btn { color: #784c35; }

  .c5 .card-bg { background: linear-gradient(135deg, rgba(243, 240, 249, 0.85), rgba(224, 213, 242, 0.85)); } 
  .c5 h2, .c5 .price, .c5 .add-btn { color: #6a4a9c; }

  .c6 .card-bg { background: linear-gradient(135deg, rgba(232, 244, 248, 0.85), rgba(205, 227, 236, 0.85)); } 
  .c6 h2, .c6 .price, .c6 .add-btn { color: #35677b; }

  /* ====== ڕەنگێن تایبەت یێن قەهوێ ====== */
  .c-lemon .card-bg { background: linear-gradient(135deg, rgba(255, 248, 224, 0.9), rgba(255, 238, 179, 0.9)); }
  .c-lemon h2, .c-lemon .price, .c-lemon .add-btn { color: #8a6a1c; }

  .c-peach .card-bg { background: linear-gradient(135deg, rgba(255, 238, 230, 0.9), rgba(252, 219, 196, 0.9)); } 
  .c-peach h2, .c-peach .price, .c-peach .add-btn { color: #a65a3a; }

  .c-melon .card-bg { background: linear-gradient(135deg, rgba(255, 245, 224, 0.9), rgba(252, 225, 179, 0.9)); } 
  .c-melon h2, .c-melon .price, .c-melon .add-btn { color: #a37c1a; }

  /* footer */
  .footer{
    flex-shrink:0;
    position:relative;
    padding:8px 20px 24px 20px;
    text-align:center;
    z-index: 50; 
  }

  .scroll-text{
    font-family:'Dancing Script', cursive;
    font-size:16px;
    color: var(--rose-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .scroll-text::before, .scroll-text::after{
    content:'';
    width:30px;
    height:1px;
    background: var(--gold-line);
  }

  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }
  .chevron{ 
    margin-top:6px; 
    opacity:0.7; 
    animation: bounceDown 2s infinite ease-in-out;
  }
  .chevron svg{ width:16px;height:16px; stroke: var(--rose-deep); }

  .cart-btn{
    position:absolute;
    right:20px;
    bottom:20px;
    width:56px;height:56px;
    border-radius:50%;
    background: linear-gradient(160deg, #e1efe7, #c1e0cd);
    border: 2px solid #ffffff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 10px 20px -5px rgba(60,110,85,0.4);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .cart-btn:hover{ transform: translateY(-4px); box-shadow: 0 14px 25px -5px rgba(60,110,85,0.5); }
  .cart-btn:active{ transform: scale(0.9); }
  .cart-btn svg{ width:22px;height:22px; stroke: var(--ink); }
  .badge{
    position:absolute;
    top:-2px; right:-2px;
    background: #ff7e93;
    color:white;
    font-size:11px;
    font-weight:700;
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    border: 2px solid #ffffff;
    transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 0; 
  }
  .badge.show { opacity: 1; transform: scale(1); }
  .badge.bump { animation: bump .4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bump{ 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }

  /* CART MODAL */
  .cart-modal {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-top: 1px solid rgba(255,255,255,0.9);
    border-top-left-radius: 35px;
    border-top-right-radius: 35px;
    padding: 24px;
    box-shadow: 0 -15px 40px rgba(0,0,0,0.15);
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10000;
    max-height: 80%;
    display: flex;
    flex-direction: column;
  }
  .cart-modal.open { transform: translateY(0); }
  
  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .cart-header h3 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px;
    color: var(--ink);
  }
  .close-cart {
    background: #fdf6f7; 
    border: 1px solid #f2d5db; 
    width: 32px; height: 32px; 
    border-radius: 50%;
    font-size: 20px; 
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--rose-deep);
    transition: all 0.2s;
  }
  .close-cart:hover { background: #ffe5e9; transform: scale(1.1); }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 16px;
    padding-right: 5px;
  }
  .cart-items::-webkit-scrollbar { width: 4px; }
  .cart-items::-webkit-scrollbar-thumb { background: #e7b9c2; border-radius: 4px; }

  .cart-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px dashed rgba(231, 185, 194, 0.5);
    font-family: 'Quicksand', sans-serif;
  }
  .cart-item-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cart-item-info span:first-child {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  .cart-item-price {
    font-size: 13px;
    font-weight: 600;
    color: var(--rose-deep);
  }
  .cart-qty-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fdf6f7;
    border: 1px solid #f2d5db;
    border-radius: 20px;
    padding: 4px 10px;
  }
  .cart-qty-controls button {
    background: transparent; border: none; font-size: 16px; font-weight: bold; color: var(--rose-deep); cursor: pointer;
  }
  .cart-qty-controls span {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    min-width: 14px;
    text-align: center;
  }

  .cart-total {
    font-family: 'Quicksand', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--rose-deep);
    text-align: right;
    margin-bottom: 16px;
  }
  
  .whatsapp-btn {
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 16px;
    font-family: 'Quicksand', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(198, 90, 120, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .whatsapp-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(198, 90, 120, 0.4);
  }
  .whatsapp-btn:active { transform: scale(0.98); }

</style>
</head>
<body>

<div class="atmosphere">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="stage">
  <div class="frame">
    <!-- HEADER -->
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="9" r="3" fill="#e08aa0"/>
          <path d="M24 12 v4" stroke="#7fae93" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 20 h24 l-2 8 a10 10 0 0 1 -20 0 z" fill="#fce7ec" stroke="#c65a78" stroke-width="1.3"/>
          <path d="M13 20 c2 -8 20 -8 22 0" fill="none" stroke="#c65a78" stroke-width="1.3"/>
        </svg>
        <div class="word" id="t-brand1">Sweet</div>
        <div class="brand" id="t-brand2">BLISS</div>
        <div class="tag" id="t-tag">DESSERT &amp; COFFEE</div>
      </div>
      
      <!-- مینیو د سەنتەرێ شاشێ دا ب ڕوونی -->
      <div class="title-block">
        <h1 id="t-menuTitle">Menu <span class="heart">♥</span></h1>
        <div class="sub" id="t-subTitle">Made with love</div>
      </div>

      <div class="header-right">
        <!-- دوگمەیا داخستنێ -->
        <button class="close-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7a3648" stroke-width="2.5" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"/>
            <line x1="18" y1="6" x2="6" y2="18"/>
          </svg>
        </button>
        <!-- دوگمەیا زمانان یا خڕ -->
        <button class="lang-btn" id="langBtn">EN</button>
      </div>
    </div>

    <!-- BODY -->
    <div class="body">
      <!-- SIDEBAR -->
      <nav class="sidebar" id="sidebar">

      { id: 40, title: {EN: "Summer Vibe", KU: "هەوایێ هاڤینێ", AR: "أجواء الصيف"}, desc: {EN: "Cold Drink + Fruit Tart", KU: "ڤەخارنا سار و تارتا میوەیان", AR: "مشروب بارد وتارت فواكه"}, price: 8.75, img: localImages.img40 },
      { id: 41, title: {EN: "Choco Lover", KU: "ئەڤیندارێ شۆکۆلاتێ", AR: "عاشق الشوكولاتة"}, desc: {EN: "Lava Cake + Scoop of Vanilla", KU: "کێکا شۆکۆلاتێ و ئایسکرێم", AR: "كيكة الشوكولاتة وايس كريم"}, price: 9.00, img: localImages.img41 },
      { id: 42, title: {EN: "Tea Time", KU: "دەمێ چایێ", AR: "وقت الشاي"}, desc: {EN: "Iced Tea + Cinnamon Roll", KU: "چا سار و سینامۆن ڕۆڵ", AR: "شاي مثلج ورول القرفة"}, price: 7.25, img: localImages.img42 }
    ]
  };

  let activeCategory = 'Featured';
  const cardStack = document.getElementById('cardStack');
  let cart = []; 

  function getItemById(id) {
    for(let cat in menuData) {
      let found = menuData[cat].find(i => i.id === id);
      if(found) return found;
    }
    return null;
  }

  function updateStaticUI() {
    document.getElementById('t-brand1').innerHTML = translations[currentLang].brand1;
    document.getElementById('t-brand2').innerHTML = translations[currentLang].brand2;
    document.getElementById('t-tag').innerHTML = translations[currentLang].tag;
    document.getElementById('t-menuTitle').innerHTML = translations[currentLang].menuTitle;
    document.getElementById('t-subTitle').innerHTML = translations[currentLang].subTitle;
    document.getElementById('t-cat1').innerHTML = translations[currentLang].cat1;
    document.getElementById('t-cat2').innerHTML = translations[currentLang].cat2;
    document.getElementById('t-cat3').innerHTML = translations[currentLang].cat3;
    document.getElementById('t-cat4').innerHTML = translations[currentLang].cat4;
    document.getElementById('t-cat5').innerHTML = translations[currentLang].cat5;
    document.getElementById('t-cat6').innerHTML = translations[currentLang].cat6;
    document.getElementById('t-cat7').innerHTML = translations[currentLang].cat7;
    document.getElementById('t-scroll').innerHTML = translations[currentLang].scroll;
    document.getElementById('t-cartTitle').innerHTML = translations[currentLang].cartTitle;
    document.getElementById('t-send').innerHTML = translations[currentLang].send;
  }

  function loadCategory(categoryName) {
    activeCategory = categoryName;
    cardStack.innerHTML = ''; 
    const items = menuData[categoryName];
    if(!items) return;
    
    items.forEach((item, index) => {
      const colorClass = item.color ? item.color : `c${(index % 6) + 1}`; 
      const zIndex = 10 - index; 
      const delay = index * 0.05; 
      
      const itemTitle = item.title[currentLang];
      const itemDesc = item.desc[currentLang];
      const btnText = translations[currentLang].addBtn;

      const cardHTML = `
        <div class="card ${colorClass}" style="z-index: ${zIndex}; animation-delay: ${delay}s" data-z="${zIndex}">
          <div class="card-bg"></div>
          <div class="info">
            <h2>${itemTitle} <span class="heart">♡</span></h2>
            <p class="desc">${itemDesc}</p>
            <div class="price-row">
              <div class="price">$${item.price.toFixed(2)}</div>
              <button class="add-btn" onclick="addToCart(${item.id})">${btnText}</button>
            </div>
          </div>
          <img class="food-img" src="${item.img}" onerror="this.style.opacity='0'" alt="Food">
        </div>
      `;
      cardStack.insertAdjacentHTML('beforeend', cardHTML);
    });

    attachCardListeners();
  }

  function attachCardListeners() {
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function(e) {
        if(e.target.closest('.add-btn')) return;
        
        const wasLifted = this.classList.contains('lifted');
        
        document.querySelectorAll('.card').forEach(c => {
          c.classList.remove('lifted');
          c.style.zIndex = c.getAttribute('data-z'); 
        });
        
        if(!wasLifted) {
           this.classList.add('lifted');
           this.style.zIndex = 50; 
        }
      });
    });
  }

  const badge = document.getElementById('cartBadge');
  const cartModal = document.getElementById('cartModal');
  const cartItemsList = document.getElementById('cartItemsList');
  const cartTotalText = document.getElementById('cartTotalText');

  function addToCart(id) {
    let existing = cart.find(item => item.id === id);
    if(existing) {
      existing.qty++;
    } else {
      cart.push({ id: id, qty: 1 });
    }
    updateCartUI();
  }

  function updateQty(id, delta) {
    let existing = cart.find(item => item.id === id);
    if(existing) {
      existing.qty += delta;
      if(existing.qty <= 0) {
        cart = cart.filter(item => item.id !== id);
      }
    }
    updateCartUI();
    if(cartModal.classList.contains('open')) {
      renderCartItems();
    }
  }

  function updateCartUI() {
    let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
    badge.textContent = totalQty;
    
    if(totalQty > 0) badge.classList.add('show');
    else badge.classList.remove('show');
    
    badge.classList.remove('bump');
    void badge.offsetWidth; 
    badge.classList.add('bump');
  }

  function renderCartItems() {
    cartItemsList.innerHTML = '';
    let total = 0;
    
    cart.forEach(cartItem => {
      let itemDef = getItemById(cartItem.id);
      if(!itemDef) return;
      
      let title = itemDef.title[currentLang];
      let itemTotal = itemDef.price * cartItem.qty;
      total += itemTotal;
      
      cartItemsList.insertAdjacentHTML('beforeend', `
        <div class="cart-item">
          <div class="cart-item-info">
            <span>${title}</span>
            <span class="cart-item-price">$${itemTotal.toFixed(2)}</span>
          </div>
          <div class="cart-qty-controls">
            <button onclick="updateQty(${cartItem.id}, -1)">-</button>
            <span>${cartItem.qty}</span>
            <button onclick="updateQty(${cartItem.id}, 1)">+</button>
          </div>
        </div>
      `);
    });
    cartTotalText.textContent = `${translations[currentLang].total} $${total.toFixed(2)}`;
  }

  document.getElementById('cartBtn').addEventListener('click', () => {
    renderCartItems();
    cartModal.classList.add('open');
  });

  document.getElementById('closeCart').addEventListener('click', () => {
    cartModal.classList.remove('open');
  });

  document.getElementById('sendWhatsappBtn').addEventListener('click', () => {
    if(cart.length === 0) return alert("Cart is empty!");
    
    let message = `Hello! I would like to order:\n\n`;
    let total = 0;
    
    cart.forEach((cartItem, index) => {
      let itemDef = getItemById(cartItem.id);
      let title = itemDef.title[currentLang]; 
      let itemTotal = itemDef.price * cartItem.qty;
      
      message += `${index+1}. ${cartItem.qty}x ${title} - $${itemTotal.toFixed(2)}\n`;
      total += itemTotal;
    });
    
    message += `\nTotal: $${total.toFixed(2)}`;
    
    const encodedMessage = encodeURIComponent(message);
    const phoneNumber = "9647500000000"; 
    
    window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
  });

  updateStaticUI();
  loadCategory('Featured');

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.getAttribute('data-category');
      loadCategory(cat);
    });
  });

  const langBtn = document.getElementById('langBtn');
  
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentLangIndex = (currentLangIndex + 1) % langOrder.length;
    currentLang = langOrder[currentLangIndex];
    langBtn.textContent = currentLang; 
    
    updateStaticUI();
    loadCategory(activeCategory); 
    if(cartModal.classList.contains('open')) renderCartItems(); 
  });

</script>
</body>
</html>
